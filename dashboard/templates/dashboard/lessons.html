<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lessons | Lingua</title>

    <style>

        body {
            margin: 0;
            background: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 24px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 13px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }

        .primary {
            background: #4f46e5;
            color: white;
        }

        .back {
            background: white;
            color: #334155;
            border: 1px solid #e2e8f0;
            margin-right: 8px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 18px 22px;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }

        th {
            color: #64748b;
        }

        a {
            text-decoration: none;
        }

        .edit {
            color: #4f46e5;
            margin-right: 15px;
        }

        .delete {
            color: #dc2626;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="top">

        <div>
            <h1>Lessons 📖</h1>
            <p>Manage your learning lessons.</p>
        </div>

        <div>

            <a href="/manager/" class="btn back">
                Dashboard
            </a>

            <a href="{% url 'lesson_create' %}"
               class="btn primary">
                + Add Lesson
            </a>

        </div>

    </div>


    <div class="card">

        <table>

            <tr>
                <th>Lesson</th>
                <th>Course</th>
                <th>Level</th>
                <th>Order</th>
                <th>Actions</th>
            </tr>

            {% for lesson in lessons %}

            <tr>

                <td>
                    <strong>{{ lesson.title }}</strong>
                </td>

                <td>
                    {{ lesson.course.title }}
                </td>

                <td>
                    {{ lesson.course.level.name }}
                </td>

                <td>
                    {{ lesson.order }}
                </td>

                <td>

                    <a
                        href="{% url 'lesson_edit' lesson.pk %}"
                        class="edit"
                    >
                        Edit
                    </a>

                    <a
                        href="{% url 'lesson_delete' lesson.pk %}"
                        class="delete"
                    >
                        Delete
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="5">
                    No lessons yet.
                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
