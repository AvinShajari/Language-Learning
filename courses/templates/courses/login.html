<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lingua</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8faff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 420px;
            max-width: 92%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(40, 50, 100, .12);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #5b5ce2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .bottom {
            text-align: center;
            margin-top: 24px;
        }

        a {
            color: #5b5ce2;
            text-decoration: none;
            font-weight: 600;
        }

        .errorlist {
            color: #d33;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Welcome back 👋</h1>

    <div class="subtitle">
        Login to continue learning.
    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        {% if next %}
            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >
        {% endif %}

        <button type="submit">
            Login
        </button>

    </form>

    <div class="bottom">
        Don't have an account?
        <a href="{% url 'signup' %}">
            Sign Up
        </a>
    </div>

</div>

</body>
</html>
