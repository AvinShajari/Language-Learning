<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Lingua</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(600px, calc(100% - 30px));
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 50px rgba(15,23,42,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #64748b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>{{ title }}</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <label for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.errors %}
                <div style="color:#dc2626;">
                    {{ field.errors }}
                </div>
            {% endif %}

        {% endfor %}

        <button type="submit">
            Save Language
        </button>

    </form>

    <a href="{% url 'language_list' %}" class="back">
        ← Back to Languages
    </a>

</div>

</body>
</html>
