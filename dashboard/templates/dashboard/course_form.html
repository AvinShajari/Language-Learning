<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Lingua</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                #f8fafc;
            color: #0f172a;
        }

        .page {
            width: min(750px, calc(100% - 32px));
            margin: 55px auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #64748b;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: rgba(255,255,255,.96);
            padding: 38px;
            border-radius: 26px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 25px 60px rgba(15,23,42,.08);
        }

        .icon {
            width: 55px;
            height: 55px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: #eff6ff;
            font-size: 27px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            color: #64748b;
            margin: 8px 0 30px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dbe2ea;
            border-radius: 13px;
            background: white;
            font: inherit;
            outline: none;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.1);
        }

        .error {
            color: #dc2626;
            margin-top: 6px;
            font-size: 13px;
        }

        .upload {
            padding: 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="page">

    <a href="{% url 'course_list' %}" class="back">
        ← Back to Courses
    </a>

    <div class="card">

        <div class="icon">🎓</div>

        <h1>{{ title }}</h1>

        <p class="subtitle">
            Create or update a course for your students.
        </p>

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            {% for field in form %}

                <div class="field">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {% if field.name == "image" %}
                        <div class="upload">
                            {{ field }}
                        </div>
                    {% else %}
                        {{ field }}
                    {% endif %}

                    {% for error in field.errors %}
                        <div class="error">
                            {{ error }}
                        </div>
                    {% endfor %}

                </div>

            {% endfor %}

            <button type="submit">
                Save Course
            </button>

        </form>

    </div>

</div>

</body>
</html>
