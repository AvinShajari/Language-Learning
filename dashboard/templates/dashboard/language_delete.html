<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Language</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(450px, calc(100% - 30px));
            background: white;
            padding: 35px;
            border-radius: 22px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        button {
            padding: 13px 22px;
            border: 0;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        a {
            margin-left: 10px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Delete "{{ language.name }}"?</h2>

    <p>
        This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
        <a href="{% url 'language_list' %}">Cancel</a>
    </form>

</div>

</body>
</html>
