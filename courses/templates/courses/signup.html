<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Lingua</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8faff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 450px;
            max-width: 92%;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(40, 50, 100, .12);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #5b5ce2;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .bottom {
            text-align: center;
            margin-top: 24px;
        }

        a {
            color: #5b5ce2;
            text-decoration: none;
            font-weight: 600;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .errorlist {
            color: #d33;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Create your account 🚀</h1>

    <div class="subtitle">
        Start your language learning journey with Lingua.
    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

</div>

</body>
</html>
