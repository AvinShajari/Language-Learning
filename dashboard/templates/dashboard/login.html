<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login | Lingua</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f8fafc;
        }

        .login-card {
            width: min(430px, calc(100% - 32px));
            padding: 42px;
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(15,23,42,.12);
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #111827;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,.1);
        }

        button {
            width: 100%;
            border: 0;
            margin-top: 26px;
            padding: 15px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">Lingua</div>

    <h1>Manager Portal</h1>

    <div class="subtitle">
        Sign in to manage your language academy.
    </div>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <label for="id_username">Username</label>
        {{ form.username }}

        <label for="id_password">Password</label>
        {{ form.password }}

        <button type="submit">
            Sign in to Dashboard
        </button>
    </form>

</div>

</body>
</html>
